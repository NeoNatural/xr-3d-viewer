name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

# Tag builds must have the repository signing secrets. Untagged CI may still
# build an unsigned release APK for validation, but it can never publish one.
env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the NDK the project pins
        # The runner's shell has pipefail on, and yes dies of SIGPIPE once
        # sdkmanager stops reading, so its exit code is not the one that counts
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon testNonRootDebugUnitTest

      - name: Native unit tests
        run: make -C app/src/test/cpp test

      - name: Signing key
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "A tagged release requires KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-moonlightvr}
          EOF

      - name: Build
        run: ./gradlew --no-daemon assembleNonRootDebug assembleNonRootRelease lintNonRootRelease

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-xr-apks
          path: |
            app/build/outputs/apk/nonRoot/debug/*.apk
            app/build/outputs/apk/nonRoot/release/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-nonRootRelease.html
          if-no-files-found: ignore

      - name: Verify and stage release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          apk="app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk"
          if [ ! -f "$apk" ]; then
            echo "Signed release APK was not produced." >&2
            exit 1
          fi
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p dist
          output="dist/xr-3d-viewer-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$output"
          sha256sum "$output" > "${output}.sha256"
          cp LICENSE.txt THIRD_PARTY_NOTICES.md dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
